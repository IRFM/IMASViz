[pytest]
# pytest-qt must talk to the same binding the sources import.
qt_api = pyside6

testpaths = tests

# Several components can block (app.exec_, modal dialogs, AL calls on remote
# backends). Without a hard cap a hung test hangs the whole run.
timeout = 180

addopts = -ra

markers =
    ui: drives Qt widgets through pytest-qt (needs a QApplication, runs offscreen)
    dd: requires the IMAS data dictionary (IDSDef_<IMAS_VERSION>.xml)
    case: requires a real IMAS case, skipped when the case URI is unreachable
