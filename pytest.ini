[pytest]
# pytest-qt must talk to the same binding the sources import.
qt_api = pyside6

testpaths = tests

# Several components can block (app.exec_, modal dialogs, AL calls on remote
# backends). Without a hard cap a hung test hangs the whole run.
timeout = 180

addopts = -ra

# matplotlib (3.11.2, from ~/.local on this node) asks Qt for the deprecated
# AA_UseHighDpiPixmaps attribute every time it is asked for a toolbar icon
# pixmap (backend_qt.py:726). Setting a style or a style sheet on the
# application re-polishes every live widget, so a test that dresses the
# application while another file's matplotlib toolbar is still alive collects one
# warning per icon per dressing -- measured: 32 for one dressed test run after the
# Equilibrium plugin window exists, 0 for a test of the same file that never
# touches the QApplication. A real session dresses the application once, before
# any plugin window exists, so it never meets it. Narrowed to the module that
# raises it: a deprecation coming from IMASViz's own code still shows.
filterwarnings =
    ignore::DeprecationWarning:matplotlib.backends.backend_qt

markers =
    ui: drives Qt widgets through pytest-qt (needs a QApplication, runs offscreen)
    dd: requires the IMAS data dictionary (IDSDef_<IMAS_VERSION>.xml)
    case: requires a real IMAS case, skipped when the case URI is unreachable
